<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Desidokan Admin</title>
<style>
:root{--r:#8b0a0a;--b:#e8e0db;--m:#74655f}*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:#f3f1ef;color:#1f1411}
header{background:var(--r);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;font-weight:800}
main{max-width:760px;margin:auto;padding:12px}.c{background:#fff;border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;font:inherit;margin:3px 0 8px;background:#fff;color:inherit}
label{font-size:12px;font-weight:600;color:var(--m)}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 14px;background:var(--r);color:#fff;cursor:pointer}
button.g{background:#eee;color:#222}button.d{background:#c4300f}.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tabs button{background:#fff;color:#222;border:1px solid var(--b);white-space:nowrap}.tabs .on{background:var(--r);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.p{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.p img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:#eee}.p div{flex:1;min-width:0}.p small{color:var(--m);display:block}.h{opacity:.45}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
</style></head><body>
<header><span>Desidokan Admin</span><span id="who"></span></header><main id="m"></main><div id="t"></div>
<script>
const DB="https://desidokan-default-rtdb.europe-west1.firebasedatabase.app",KEY="AIzaSyA52wyior1yg2E9bQd081oWgJ9nHisEEd4";
const CATS={snacks:["Snacks & Chanachur","sn"],biscuits:["Biscuits & Toast","bi"],noodles:["Noodles, Semai & Soup","nd"],pickle:["Pickle (Achar)","pk"],spices:["Masala & Oil","ms"],rice:["Rice","ri"],drinks:["Tea & Drinks","te"],candy:["Candy","cd"],indian:["Indian Pantry","fl"],frozen:["Frozen Fish & Veg","ff"],pakistani:["Pakistani Products","pa"],muri:["Puffed Rice (Muri)","mu"],turkish:["Turkey & Azerbaijan","tk"]};
const GC={sn:"snacks",bi:"biscuits",to:"biscuits",se:"noodles",nd:"noodles",pk:"pickle",ms:"spices",ol:"spices",ri:"rice",te:"drinks",en:"drinks",cd:"candy",fl:"indian",sp:"indian",ff:"frozen",fv:"frozen",fp:"frozen",ds:"frozen",pa:"pakistani",mu:"muri",tk:"turkish"};
const $=s=>document.querySelector(s),v=s=>$(s).value.trim(),esc=x=>String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={},OLD=[],tok="",exp=0,cred=null,tab="prod",q="",ed=null;
const toast=m=>{const e=$("#t");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2600)};
async function login(e,p){const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||"Login failed");tok=j.idToken;exp=Date.now()+3300e3;cred=[e,p]}
async function api(m,path,body){if(Date.now()>exp)await login(...cred);const r=await fetch(DB+path+".json?auth="+tok,{method:m,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error("Save failed ("+r.status+"). Check Firebase rules / login.");const out=await r.json();if(m!=="GET"&&path.indexOf("/store/")===0&&path!=="/store/v")await fetch(DB+"/store/v.json?auth="+tok,{method:"PUT",headers:{"Content-Type":"application/json"},body:String(Date.now())});return out}
async function load(){S=(await fetch(DB+"/store.json",{cache:"no-store"}).then(r=>r.json()))||{}}
async function loadOld(){const t=await fetch("index.html").then(r=>r.text()),m=t.match(/const RAW=`([\s\S]*?)`/);OLD=m?m[1].split("\n").map((l,i)=>{const[n,s,p,o,g]=l.split("|");return{id:i,n,s,p:+p,o:+o||0,g}}):[]}
function img(f,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",q))};i.onerror=no;i.src=r.result};r.readAsDataURL(f)})}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message)}};
const cn=k=>((S.cats||{})[k]||{}).en||(CATS[k]||[k])[0];
const allCats=()=>[...Object.keys(CATS),...Object.keys(S.cats||{}).filter(k=>!CATS[k]).sort()];
function loginUI(){$("#m").innerHTML=`<div class="c"><h3>Owner login</h3><label>Email</label><input id="le" type="email"><label>Password</label><input id="lp" type="password"><button id="lg" style="width:100%">Login</button></div>`;
$("#lg").onclick=run(async()=>{await login(v("#le"),$("#lp").value);$("#who").textContent="✓ "+v("#le");toast("Loading…");await Promise.all([load(),loadOld()]);draw()})}
function rows(){const E=S.edits||{},ql=q.toLowerCase();
const a=OLD.map(o=>{const e=E[o.id]||{};return{t:"old",id:o.id,n:e.n||o.n,s:e.s??o.s,p:e.p??o.p,o:e.o??o.o,h:e.h,im:e.im,st:e.st,na:e.na,ed:!!E[o.id]}});
const b=Object.entries(S.products||{}).sort().map(([k,d])=>({t:"new",k,...d,nw:1}));
return[...b.reverse(),...a].filter(x=>!ql||(x.n+" "+x.s).toLowerCase().includes(ql))}
function form(){let cur={},t=ed.t,ck;
if(t==="old"){const o=OLD[ed.id],e=(S.edits||{})[ed.id]||{};cur={n:e.n||o.n,s:e.s??o.s,p:e.p??o.p,o:e.o??o.o,h:e.h,d:e.d,im:e.im,st:e.st,na:e.na,nt:e.nt};const g=e.g||o.g;ck=CATS[g]?g:GC[g]}
else if(ed.k){cur=S.products[ed.k];ck=Object.keys(CATS).find(k=>CATS[k][1]===cur.g)||cur.g}
else ck="snacks";
const sel=t==="old"?((S.edits||{})[ed.id]||{}).g?(Object.keys(CATS).find(k=>CATS[k][1]===S.edits[ed.id].g)||S.edits[ed.id].g):GC[OLD[ed.id].g]:ck;
const go=allCats().map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(cn(k))}</option>`).join("");
return`<div class="c"><h3>${t==="old"?"Edit: "+esc(OLD[ed.id].n):ed.k?"Edit product":"New product"}</h3><label>Name</label><input id="fn" value="${esc(cur.n)}"><label>Size / weight</label><input id="fs" value="${esc(cur.s)}"><div class="row"><div><label>Price €</label><input id="fp" type="number" step="0.01" value="${cur.p??""}"></div><div><label>Old price € (offer, optional)</label><input id="fo" type="number" step="0.01" value="${cur.o||""}"></div></div>
<label>Category</label><select id="fg">${go}</select><label>Description (optional, shown on product page)</label><input id="fd" value="${esc(cur.d)}"><label>Status</label><select id="fh"><option value="0">Visible</option><option value="1" ${cur.h?"selected":""}>Hidden (not shown on website)</option></select><div class="row"><div><label>Stock left (pieces) – empty = do not show</label><input id="fst" type="number" min="0" step="1" inputmode="numeric" value="${cur.st??""}"></div><div><label>New arrival</label><select id="fna"><option value="0">No</option><option value="1" ${cur.na?"selected":""}>Yes – show in New arrivals</option></select></div></div><label>Photo ${t==="old"||ed.k?"(leave empty = keep current)":""}</label><input id="fi" type="file" accept="image/*">
<div class="row"><button id="sv">Save</button><button class="g" id="cx">Cancel</button>${t==="old"&&(S.edits||{})[ed.id]?'<button class="d" id="rs">Reset to original</button>':""}</div></div>`}
function catForm(){const k=ed.k,c=(S.cats||{})[k]||{};return`<div class="c"><h3>${k?"Edit category":"New category"}</h3><label>Name (English)</label><input id="ce" value="${esc(c.en||(k&&CATS[k]?CATS[k][0]:""))}"><label>Lietuvių (optional)</label><input id="cl" value="${esc(c.lt)}"><label>বাংলা (optional)</label><input id="cb" value="${esc(c.bn)}"><label>Status</label><select id="ch"><option value="0">Visible</option><option value="1" ${c.h?"selected":""}>Hidden</option></select><div class="row"><button id="cs">Save</button><button class="g" id="cx">Cancel</button></div></div>`}
function draw(){const T=[["prod","Products"],["sl","Banners"],["cat","Categories"],["hr","Opening hours"],["set","Site settings"]];
let h=`<div class="tabs">${T.map(([k,n])=>`<button data-t="${k}" class="${tab===k?"on":""}">${n}</button>`).join("")}</div>`;
if(tab==="prod"){h+=ed?form():`<div class="row"><input id="qq" placeholder="Search product…" value="${esc(q)}"><button id="nw" style="flex:none;margin:3px 0 8px">+ Add product</button></div><div class="c">${rows().map(x=>`<div class="p ${x.h?"h":""}">${x.im?`<img src="${x.im}">`:"<img>"}<div><b>${esc(x.n)}</b>${x.nw?" 🆕":x.ed?" ✎":""}<small>${esc(x.s)} · €${x.p}${x.o?" (was €"+x.o+")":""}${x.h?" · hidden":""}${x.st!==undefined&&x.st<=0?" · <b style=\"color:#c4300f\">OUT OF STOCK</b>":""}${x.na?" · <b style=\"color:#19945a\">★ NEW</b>":""}</small></div><input class="sk" type="number" min="0" inputmode="numeric" placeholder="stock" title="Stock left" value="${x.st??""}" data-sk="${x.t==="old"?"o"+x.id:"n"+x.k}" style="width:62px;flex:none;margin:0;padding:8px 6px"><button class="g" data-na="${x.t==="old"?"o"+x.id:"n"+x.k}" title="New arrival on/off" style="flex:none;padding:9px 11px;${x.na?"background:#19945a;color:#fff":""}">★</button><button class="g" data-e="${x.t==="old"?"o"+x.id:"n"+x.k}" style="flex:none">Edit</button></div>`).join("")||"No products"}</div>`}
if(tab==="sl")h+=`<div class="c"><h3>Add banner</h3><label>Image</label><input id="si" type="file" accept="image/*"><label>Title</label><input id="st"><label>Subtitle</label><input id="ss"><button id="sa">Add banner</button></div>`+Object.entries(S.slides||{}).sort().map(([k,d])=>`<div class="c p"><img src="${d.im}"><div><b>${esc(d.t)}</b><small>${esc(d.s)}</small></div><button class="d" data-ds="${k}">Delete</button></div>`).join("");
if(tab==="cat")h+=ed?catForm():`<button id="nc" style="margin-bottom:10px">+ Add category</button><div class="c">${allCats().map(k=>{const c=(S.cats||{})[k]||{};return`<div class="p ${c.h?"h":""}"><div><b>${esc(cn(k))}</b><small>${CATS[k]?"built-in":"custom"}${c.h?" · hidden":""}</small></div><button class="g" data-ec="${k}">Edit</button></div>`}).join("")}</div>`;
if(tab==="hr"){const H=S.hours||{},D=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];h+=`<div class="c"><h3>Opening hours</h3><small style="color:var(--m)">Default: 12:00 – 00:00 (12 PM to 12 AM midnight). 00:00 as closing time = midnight. Choose "Closed" for a day off.</small>`+[1,2,3,4,5,6,0].map(i=>{const d=H[i]||{};return`<div class="c" style="margin:8px 0"><b>${D[i]}</b><div class="row"><div><label>Open</label><input type="time" id="ho${i}" value="${esc(d.o||"12:00")}"></div><div><label>Close</label><input type="time" id="hc${i}" value="${esc(d.c||"00:00")}"></div><div><label>Status</label><select id="hx${i}"><option value="0">Open</option><option value="1" ${d.x?"selected":""}>Closed (day off)</option></select></div></div></div>`}).join("")+`<button id="hsv" style="width:100%">Save opening hours</button></div>`}
if(tab==="set"){const n=S.notice||{},g=S.cfg||{},H=g.hero||{},L=(l,n)=>`<label>Hero title (${n})</label><input id="ht${l}" value="${esc((H[l]||{}).t)}"><label>Hero subtitle (${n})</label><input id="hs${l}" value="${esc((H[l]||{}).s)}">`;
h+=`<div class="c"><h3>Top notice</h3><label>Text (shown on every phone)</label><input id="nt" value="${esc(n.t)}"><label>Status</label><select id="no"><option value="1">On</option><option value="0" ${n.t&&!n.on?"selected":""}>Off</option></select></div>
<div class="c"><h3>Contact (empty = keep default)</h3><label>Phone, e.g. +370 632 00730</label><input id="gp" value="${esc(g.phd)}"><label>Email</label><input id="gm" value="${esc(g.em)}"><label>Facebook link</label><input id="gf" value="${esc(g.fb)}"><label>Instagram link</label><input id="gi" value="${esc(g.ig)}"><label>WhatsApp group link</label><input id="gw" value="${esc(g.wa)}"></div>
<div class="c"><h3>Home page text (empty = keep default)</h3>${L("en","English")}${L("lt","Lietuvių")}${L("bn","বাংলা")}</div><button id="ns" style="width:100%">Save settings</button>`}
$("#m").innerHTML=h}
document.addEventListener("click",run(async e=>{const b=e.target.closest("button");if(!b||!cred)return;const d=b.dataset,id=b.id;
if(d.t){tab=d.t;ed=null;return draw()}
if(d.na!==undefined){const k=d.na,od=k[0]==="o",key=k.slice(1),path=od?"/store/edits/"+key:"/store/products/"+key,cu=od?((S.edits||{})[key]||{}):((S.products||{})[key]||{});await api("PATCH",path,cu.na?{na:0}:{na:1,nt:Date.now()});await load();draw();return toast(cu.na?"Removed from New arrivals":"Added to New arrivals ✓")}
if(d.e){ed=d.e[0]==="o"?{t:"old",id:+d.e.slice(1)}:{t:"new",k:d.e.slice(1)};return draw()}
if(d.ec){ed={k:d.ec};return draw()}
if(id==="nw"){ed={t:"new"};return draw()}if(id==="nc"){ed={};return draw()}if(id==="cx"){ed=null;return draw()}
if(id==="rs"){await api("DELETE","/store/edits/"+ed.id);await load();ed=null;draw();return toast("Reset ✓")}
if(id==="sv"){const o={n:v("#fn"),s:v("#fs"),p:+v("#fp"),o:+v("#fo")||0,d:v("#fd"),h:+$("#fh").value},f=$("#fi").files[0],ck=$("#fg").value,g=CATS[ck]?CATS[ck][1]:ck;if(!o.n||!(o.p>0))return toast("Name & price required");const sv=v("#fst");if(sv!=="")o.st=Math.max(0,Math.floor(+sv));o.na=+$("#fna").value;const pv=ed.t==="old"?((S.edits||{})[ed.id]||{}):(ed.k?(S.products||{})[ed.k]||{}:{});if(o.na)o.nt=pv.na&&pv.nt?pv.nt:Date.now();if(f)o.im=await img(f,420,.72);
if(ed.t==="old"){const c=(S.edits||{})[ed.id]||{};if(!f&&c.im)o.im=c.im;if(ck!==GC[OLD[ed.id].g])o.g=g;await api("PUT","/store/edits/"+ed.id,o)}
else{o.g=g;if(ed.k){const c=S.products[ed.k];if(!f&&c.im)o.im=c.im}await api("PUT","/store/products/"+(ed.k||"p"+Date.now()),o)}
await load();ed=null;draw();return toast("Saved ✓ – live on all phones")}
if(id==="sa"){const f=$("#si").files[0];if(!f)return toast("Choose image");await api("PUT","/store/slides/s"+Date.now(),{im:await img(f,900,.75),t:v("#st"),s:v("#ss")});await load();draw();return toast("Added ✓")}
if(d.ds){await api("DELETE","/store/slides/"+d.ds);await load();draw();return toast("Deleted")}
if(id==="cs"){if(!v("#ce"))return toast("Name required");await api("PUT","/store/cats/"+(ed.k||"c"+Date.now()),{en:v("#ce"),lt:v("#cl"),bn:v("#cb"),h:+$("#ch").value});await load();ed=null;draw();return toast("Saved ✓")}
if(id==="hsv"){const o={};for(let i=0;i<7;i++)o[i]={o:v("#ho"+i)||"12:00",c:v("#hc"+i)||"00:00",x:+$("#hx"+i).value};await api("PUT","/store/hours",o);await load();draw();return toast("Opening hours saved ✓")}
if(id==="ns"){const hero={};["en","lt","bn"].forEach(l=>{hero[l]={t:v("#ht"+l),s:v("#hs"+l)}});await api("PUT","/store/notice",{t:v("#nt"),on:+$("#no").value});await api("PUT","/store/cfg",{phd:v("#gp"),em:v("#gm"),fb:v("#gf"),ig:v("#gi"),wa:v("#gw"),hero});await load();draw();return toast("Saved ✓")}}));
document.addEventListener("change",run(async e=>{const el=e.target;if(!el.classList||!el.classList.contains("sk")||!cred)return;const k=el.dataset.sk,od=k[0]==="o",key=k.slice(1),path=od?"/store/edits/"+key:"/store/products/"+key,val=el.value.trim();await api("PATCH",path,{st:val===""?null:Math.max(0,Math.floor(+val))});await load();draw();toast(val===""?"Stock cleared":"Stock saved: "+val+" ✓")}));
document.addEventListener("input",e=>{if(e.target.id==="qq"){q=e.target.value;const p=e.target.selectionStart;draw();const i=$("#qq");i.focus();i.setSelectionRange(p,p)}});
loginUI();
</script></body></html>
