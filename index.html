sn:{en:["Crunchy, spicy South-Asian snack mix of fried noodles, peas and peanuts. Salty, hot, a little tangy.","Eat from the bag, or sprinkle on salad, soup or yoghurt for crunch.","Like spicy beer snacks (alaus užkandžiai) or party mix."],lt:["Traškus, aštrus Pietų Azijos užkandis: keptos makaronų juostelės, žirniai, žemės riešutai. Sūrus, aštrus, truputį rūgštelis.","Valgykite iš pakelio, barstykite ant salotų ar sriubos traškumui.","Panašu į aštrius alaus užkandžius."]},
bi:{en:["Tea-time biscuits: lightly sweet, crisp, some salted or with cardamom, malt or peanut.","Dip in hot milk tea or coffee. Good lunchbox snack.","Like Lithuanian sausainiai or digestive biscuits with tea."],lt:["Arbatos sausainiai: lengvai saldūs, traškūs, kai kurie sūrūs, su kardamonu, saldu ar žemės riešutais.","Mirkykite karštoje arbatoje ar kavoje. Tinka priešpiečiams.","Panašu į sausainius prie arbatos."]},
to:{en:["Dry baked rusk/toast, crunchy and mildly sweet or buttery (ghee).","Dunk in sweet milk tea until soft. Never eat dry fast: it is meant for dipping.","Like džiūvėsėliai or rusks with tea."],lt:["Sausas kepinys skrebutis, traškus, švelniai saldus ar sviestinis (ghee).","Pamirkykite saldžioje arbatoje su pienu.","Panašu į džiūvėsėlius prie arbatos."]},
se:{en:["Thin fried vermicelli for sweet dessert. Mildly sweet, nutty, milky.","Boil in milk with sugar, cardamom, raisins and nuts. Served warm at festivals.","Like sweet milk noodle pudding (pieniška vermišelių sriuba)."],lt:["Plonos keptos vermišelės desertui. Švelniai saldžios, riešutiškos.","Virkite piene su cukrumi, kardamonu, razinomis ir riešutais.","Panašu į saldžią pienišką vermišelių sriubą."]},
nd:{en:["Instant noodles / soup mix. Savoury and mildly spicy.","Boil 3 minutes, add egg or vegetables.","Like instant ramen or packet soup."],lt:["Greitai paruošiami makaronai / sriuba. Sotūs, švelniai aštrūs.","Virkite 3 min., pridėkite kiaušinį ar daržovių.","Panašu į greito paruošimo makaronus."]},
pk:{en:["Achar: pickled fruit in mustard oil and spices. Sour, hot, salty and very strong.","Eat a small spoon with rice, dal, or on a sandwich with cheese or cold cuts.","Like marinated gherkins but spicy and oily."],lt:["Achar: marinuoti vaisiai garstyčių aliejuje su prieskoniais. Rūgštu, aštru, sūru.","Valgykite po šaukštelį su ryžiais, lęšiais ar sumuštiniu su sūriu.","Panašu į marinuotus agurkus, bet aštrus ir aliejingas."]},
ms:{en:["Ready spice blends and whole spices. Deep, warm, aromatic: cumin, coriander, chilli, turmeric.","Fry with onion and oil, add chicken, beef, fish or lentils, simmer. Follow the pack.","Like a stew seasoning (troškinio prieskoniai) with a warm, spicy kick."],lt:["Paruošti prieskonių mišiniai ir prieskoniai. Gilus, šiltas aromatas: kmynai, kalendra, čili, ciberžolė.","Pakepinkite su svogūnais, pridėkite vištienos, jautienos, žuvies ar lęšių, troškinkite.","Panašu į troškinio prieskonius, bet aštresni."]},
ol:{en:["Pungent mustard oil / kasundi. Sharp, nose-tingling like horseradish.","Drizzle on rice with fish, or fry fish and vegetables. Heat it first to mellow.","Like horseradish (krienai) or strong mustard (garstyčios)."],lt:["Aštrus garstyčių aliejus / kasundi. Aštrus, tarsi krienai.","Apšlakstykite ryžius su žuvimi, kepkite žuvį. Pirma įkaitinkite.","Panašu į krienus ar stiprias garstyčias."]},
ri:{en:["Fragrant small-grain aromatic rice. Soft, slightly sticky, floral.","Rinse, boil 1:1.5 with water, 15 min. Use for polao, biryani, khichuri, kheer.","Like jasmine or basmati rice, softer."],lt:["Kvapnūs smulkūs aromatiniai ryžiai. Minkšti, šiek tiek lipnūs.","Nuplaukite, virkite 1:1,5 su vandeniu 15 min. Plovui, biryani, desertui.","Panašu į jazminų ar basmati ryžius."]},
te:{en:["Strong black CTC tea. Dark, bold, malty.","Boil with milk and sugar for 'cha'. 1 tsp per cup.","Like strong black tea with milk."],lt:["Stipri juoda arbata. Tamsi, sodri.","Virkite su pienu ir cukrumi. 1 šaukštelis puodeliui.","Panašu į stiprią juodą arbatą su pienu."]},
cd:{en:["Tangy fruit candy: tamarind or mango. Sweet, sour, a little salty.","Suck slowly. Kids' favourite.","Like sour fruit sweets."],lt:["Rūgštoki vaisių saldainiai: tamarindas ar mangas.","Čiulpkite lėtai.","Panašu į rūgščius vaisinius saldainius."]},
fl:{en:["Pantry staples: lentils, beans, flours. Earthy and nutty.","Boil dal 20 min with turmeric and salt, then temper with fried garlic and cumin. Gram flour makes pakora batter.","Like lentil or pea soup (lęšių / žirnių sriuba)."],lt:["Pagrindiniai produktai: lęšiai, pupelės, miltai. Žemiškas, riešutinis skonis.","Virkite dal 20 min. su ciberžole, pagardinkite keptais česnakais ir kmynais.","Panašu į lęšių ar žirnių sriubą."]},
ff:{en:["Frozen Bangladeshi river fish. Mild, rich; hilsa is oily and prized, small fish are crisp.","Thaw, wash, marinate with turmeric and salt, then fry or curry with mustard and chilli.","Rui/mrigal like carp (karpis), small fish like smelt (stinta), hilsa like herring (silkė)."],lt:["Šaldytos Bangladešo upių žuvys. Švelnios, riebios; hilsa riebi, mažos žuvelės traškios.","Atitirpinkite, nuplaukite, pamarinuokite ciberžole ir druska, kepkite ar troškinkite.","Rui/mrigal kaip karpis, mažos žuvelės kaip stintos, hilsa kaip silkė."]},
fv:{en:["Cleaned, cut Bangladeshi vegetables, ready to cook. Mild, green, earthy.","Cook straight from frozen with onion, turmeric, chilli and a little water.","Like frozen mixed vegetables for stew."],lt:["Išvalytos, supjaustytos Bangladešo daržovės. Švelnios, žemiškos.","Troškinkite tiesiai iš šaldiklio su svogūnu, ciberžole, čili.","Panašu į šaldytų daržovių mišinį troškiniui."]},
fp:{en:["Flaky, layered flatbread. Buttery, soft, chewy.","Cook straight from frozen on a hot pan 2 min per side. Eat with curry, egg or sweet tea.","Like a flaky pancake or layered flatbread."],lt:["Sluoksniuota plokščia duona. Sviestinė, minkšta.","Kepkite tiesiai iš šaldiklio karštoje keptuvėje po 2 min. Valgykite su troškiniu ar kiaušiniu.","Panašu į sluoksniuotą blyną."]}};
